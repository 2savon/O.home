<!--
  아보카도 TRPG 시트 : 마기카로기아 (v1.8 디자인 · 크툴루의 부름 7판 시트와 같은 디자인)
  - 특기를 클릭하면 습득 표시(○), 모든 특기의 목표치가 자동 계산됩니다 (습득 특기 5, 한 칸 멀어질 때마다 +1, 최대 12)
  - 분야 사이 갭(머리줄의 작은 ○)을 칠하면 그 사이 거리가 1 줄어듭니다. 특기표의 좌우 끝(어둠-별)은 이어져 있어요
  - 장서의 지정특기에 특기 이름을 적으면 목표치가 옆에 표시됩니다
  - 입력 키(data-k)는 예전 시트와 같아서 저장해 둔 값이 그대로 보여요
-->
<style>

.spw { padding: 0 14px; }

/* 편집 모드 : 이미지 변경 버튼 */

</style>

<script>
(function () {
    var CATS = ['1.별', '2.짐승', '3.힘', '4.노래', '5.꿈', '6.어둠'];
    var COL = 'ABCDEF';
    var GAP = ['chk_A', 'chk_B', 'chk_C', 'chk_D', 'chk_E', 'chk_Z']; // GAP[i] = i번 분야와 그 오른쪽 분야 사이 (마지막은 어둠-별)
    var SK = [
        ['황금','살','중력','이야기','추억','심연'], ['대지','벌레','바람','선율','수수께끼','부패'], ['숲','꽃','흐름','눈물','거짓','배신'],
        ['길','피','물','이별','불안','방황'], ['바다','비늘','파문','미소','잠','나태'], ['정적','혼돈','자유','마음','우연','왜곡'],
        ['비','이빨','충격','승리','환각','불행'], ['폭풍','외침','우레','사랑','광기','바보'], ['태양','분노','불','정열','기도','악의'],
        ['천공','날개','빛','치유','희망','절망'], ['이계','에로스','원환','시간','미래','죽음']
    ];
    var BOOKS = 10, ANCHORS = 10;
    function $(id) { return document.getElementById(id); }
    function pad(i) { return i < 10 ? '0' + i : '' + i; }
    function gapCk(i) { return '<th class="gap"><input type="checkbox" class="ck" data-k="' + GAP[i] + '" title="갭"></th>'; }

    // 특기표 : 번호 | 갭(어둠-별) | 별 | 갭 | 짐승 | … | 어둠
    var h = '<colgroup><col style="width:34px"><col style="width:14px">';
    for (var c = 0; c < 6; c++) h += '<col>' + (c < 5 ? '<col style="width:14px">' : '');
    h += '</colgroup><thead><tr><th class="no"></th>' + gapCk(5);
    for (c = 0; c < 6; c++) h += '<th>' + CATS[c] + '</th>' + (c < 5 ? gapCk(c) : '');
    h += '</tr></thead><tbody>';
    for (var r = 0; r < 11; r++) {
        h += '<tr><th>' + (r + 2) + '</th><td class="gap" data-g="5"></td>';
        for (c = 0; c < 6; c++) {
            var id = COL[c] + (r + 2);
            h += '<td class="c" id="c_' + id + '"><label><input type="checkbox" class="ck" data-k="' + id + '"><span>' + SK[r][c] + '</span><b id="v_' + id + '"></b></label></td>'
                + (c < 5 ? '<td class="gap" data-g="' + c + '"></td>' : '');
        }
        h += '</tr>';
    }
    $('sp').innerHTML = h + '</tbody>';

    // 지정특기 자동완성 목록
    // 1열(별) 위→아래, 2열(짐승) 위→아래 … 순서 · 열마다 영역명을 먼저
    var dl = '';
    for (var dc = 0; dc < 6; dc++) {
        dl += '<option value="' + CATS[dc].replace(/^\d+\./, '') + '">';
        for (var dr = 0; dr < 11; dr++) dl += '<option value="' + SK[dr][dc] + '">';
    }
    dl += '<option value="가변">';
    $('skl').innerHTML = dl;


    // 장서
    var bk = '';
    for (var i = 1; i <= BOOKS; i++) {
        var p = 'Magic_' + pad(i) + '_';
        bk += '<div class="bk"><div class="l1">'
            + '<input class="f nmf" data-k="' + p + 'Name" placeholder="장서명">'
            + '<select class="f" data-k="' + p + 'Types"><option value="">타입</option><option>소환</option><option>주문</option><option>장비</option></select>'
            + '<input class="f" data-k="' + p + 'Assigned_Skill" list="skl" placeholder="지정특기">'
            + '<span class="tg" id="bt_' + i + '" title="목표치"></span></div>'
            + '<div class="l2"><span>COST</span><input class="f" data-k="' + p + 'Cost" placeholder="-">'
            + '<span>목표</span><input class="f" data-k="' + p + 'skillTarget" placeholder="없음"></div>'
            + '<textarea class="f" rows="2" data-k="' + p + 'Effect" placeholder="효과"></textarea>'
            + '<textarea class="f subnote" rows="1" data-k="' + p + 'Chant" placeholder="주구"></textarea>'
            + '<textarea class="f subnote" rows="1" data-k="' + p + 'Summary" placeholder="개요"></textarea></div>';
    }
    $('bk').innerHTML = bk;

    // 관계
    var rl = '';
    for (i = 1; i <= ANCHORS; i++) {
        rl += '<div><span class="hl"><input class="f" data-k="relation_name_' + pad(i) + '" placeholder="앵커 이름"></span>'
            + '<span class="cap">운명점</span><input class="n" type="number" inputmode="numeric" min="0" data-k="relation_fate_' + pad(i) + '">'
            + '<span class="cap">속성</span><input class="f" data-k="relation_link_' + pad(i) + '">'
            + '<span class="cap st">설정</span><textarea class="f s" rows="1" data-k="relation_' + pad(i) + '"></textarea></div>';
    }
    $('rl').innerHTML = rl;

    // ----- 목표치 계산 -----
    var S = window.AvoSheet;
    // 캐릭터 테마 컬러로 옅은 색(--tint) 만들기
    function tints() {
        var c = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
        var m = c.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i), r, g, b;
        if (m) {
            var hx = m[1].length === 3 ? m[1].replace(/./g, '$&$&') : m[1];
            r = parseInt(hx.substr(0, 2), 16); g = parseInt(hx.substr(2, 2), 16); b = parseInt(hx.substr(4, 2), 16);
        } else if ((m = c.match(/(\d+)\D+(\d+)\D+(\d+)/))) { r = +m[1]; g = +m[2]; b = +m[3]; } else return;
        var st = document.documentElement.style;
        st.setProperty('--tint', 'rgba(' + r + ',' + g + ',' + b + ',.08)');
        st.setProperty('--tint2', 'rgba(' + r + ',' + g + ',' + b + ',.15)');
        st.setProperty('--tint3', 'rgba(' + r + ',' + g + ',' + b + ',.35)');
    }
    S.onInit(tints);
    function on(k) { var v = S.get(k); return !!v && v !== '0'; }
    function calc() {
        var step = [], total = 0;
        for (var c = 0; c < 6; c++) { step[c] = on(GAP[c]) ? 1 : 2; total += step[c]; }
        function hdist(a, b) {               // 분야 a → b 가로 거리 (좌우 끝 이어짐)
            var d = 0; for (var x = a; x !== b; x = (x + 1) % 6) d += step[x];
            return Math.min(d, total - d);
        }
        var got = [];
        for (var r = 0; r < 11; r++) for (c = 0; c < 6; c++) if (on(COL[c] + (r + 2))) got.push([r, c]);
        var tv = {};
        for (r = 0; r < 11; r++) for (c = 0; c < 6; c++) {
            var id = COL[c] + (r + 2), best = '';
            got.forEach(function (g) {
                var t = 5 + Math.abs(g[0] - r) + hdist(g[1], c);
                if (best === '' || t < best) best = t;
            });
            if (best !== '' && best > 12) best = 12;
            tv[SK[r][c]] = best;
            $('v_' + id).textContent = best;
            $('c_' + id).classList.toggle('on', on(id));
        }
        Array.prototype.forEach.call(document.querySelectorAll('td.gap'), function (td) {
            td.classList.toggle('on', on(GAP[+td.getAttribute('data-g')]));
        });
        Array.prototype.forEach.call(document.querySelectorAll('select[data-k]'), function (el) { el.classList.toggle('empty', !el.value); });
        var soul = String(S.get('Soul') || '').trim();
        var soulTv = parseInt(S.get('Soul_tv'), 10); if (isNaN(soulTv)) soulTv = 6; // 혼의 특기 목표치 (직접 입력, 비우면 6)
        if (soul && (tv[soul] === undefined || tv[soul] === '' || tv[soul] > soulTv)) tv[soul] = soulTv;
        for (var i = 1; i <= BOOKS; i++) {
            var sk = String(S.get('Magic_' + pad(i) + '_Assigned_Skill') || '').trim();
            $('bt_' + i).textContent = sk && tv[sk] !== undefined ? tv[sk] : '';
            $('bt_' + i).parentNode.parentNode.classList.toggle('none', !S.get('Magic_' + pad(i) + '_Name') && !S.get('Magic_' + pad(i) + '_Effect'));
        }
        // 보기 모드에서는 비어 있는 장서·관계 칸을 숨김
        for (i = 1; i <= ANCHORS; i++) {
            var el = document.querySelector('[data-k="relation_name_' + pad(i) + '"]');
            el.parentNode.parentNode.classList.toggle('none', !S.get('relation_name_' + pad(i)) && !S.get('relation_' + pad(i)));
        }
    }
    // 설명칸 높이를 내용에 맞춤
    function fit(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
    function fitAll() { Array.prototype.forEach.call(document.querySelectorAll('textarea'), fit); }
    document.addEventListener('input', function (e) { if (e.target.tagName === 'TEXTAREA') fit(e.target); });
    S.onInit(function () { fitAll(); setTimeout(fitAll, 300); });
    window.addEventListener('load', fitAll);
    S.onChange(calc);
})();
</script>
